<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Justin’s Sports — NFL, MLB, NBA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --text:#111; --muted:#666; --rule:#eee; --accent:#0d6efd; --bg:#fff; }
    body { font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:2rem; color:var(--text); background:var(--bg); }
    h1 { margin:.25rem 0 .5rem }
    h2 { margin:1.25rem 0 .5rem; font-size:1.1em }
    #stamp { color:var(--muted); margin-bottom:.5rem }
    .small { color:var(--muted); font-size:.9em }
    ul { list-style:none; padding:0; margin:0 }
    li { padding:.5rem 0; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:.6rem; }
    .logo { width:28px; height:28px; object-fit:contain; flex:0 0 28px; }
    .row { display:flex; flex-direction:column; }
    .line { display:inline-block; }
    #status { margin:.5rem 0 1rem; }

    /* Right-side floating banner */
    #side-banner {
      position: fixed; top: 24px; right: 24px; max-width: 360px;
      background:#f0f8ff; border:2px solid var(--accent); border-radius:12px;
      padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:999;
      font-weight:600; line-height:1.3;
    }

    #attrib {
      background:#f6f6f6; border:1px solid var(--rule); padding:8px 12px; border-radius:8px;
      font-size:.9em; color:var(--muted); margin-bottom:12px; max-width:960px;
    }

    /* Controls */
    #controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:.25rem 0 1rem; max-width:960px; }
    #controls label { font-size:.9em; color:var(--muted); }
    #controls select {
      padding:6px 8px; border:1px solid var(--rule); border-radius:6px; font-size:.95em; background:#fff;
    }
    #controls button {
      padding:6px 10px; border:1px solid var(--accent); border-radius:6px; font-size:.95em;
      background:var(--accent); color:#fff; cursor:pointer;
    }
    #controls button:disabled { opacity:.6; cursor:progress; }
    .hidden { display:none !important; }

    /* Leaders ribbon */
    #leadersWrap { max-width: 960px; margin: 0 0 12px; }
    #leadersWrap h2 { margin: .75rem 0 .5rem; font-size: 1.1em; }
    #leaders { display:flex; flex-wrap:wrap; gap:10px; }
    .leader-card {
      display:flex; align-items:center; gap:10px;
      border:1px solid var(--rule); border-radius:10px; padding:8px 10px; background:#fff;
      min-width:250px;
    }
    .leader-logo { width:32px; height:32px; object-fit:contain; flex:0 0 32px; }
    .leader-main { display:flex; flex-direction:column; line-height:1.15; }
    .leader-name { font-weight:700; }
    .leader-sub { font-size:.9em; color:var(--muted); }

    /* Section widths */
    #auto-note, #title, #stamp, #status, #list, #gamesWrap { max-width:960px; }
    #auto-note { margin-top:-.25rem; margin-bottom:.75rem; color:var(--muted); font-size:.9em; }

    /* Matchup accordion */
    details.game { border:1px solid var(--rule); border-radius:10px; padding:.25rem .75rem; background:#fff; }
    details.game + details.game { margin-top:.5rem; }
    summary.game-head { display:flex; align-items:center; gap:.5rem; cursor:pointer; padding:.4rem 0; list-style:none; }
    .game-meta { display:flex; align-items:center; gap:.5rem; }
    .game-logo { width:22px; height:22px; object-fit:contain; }
    .game-vs { color:var(--muted); font-weight:600; }
    .score { font-weight:700; margin-left:.5rem; }
    .statusNote { color:var(--muted); font-size:.9em; margin-left:.5rem; }
    .teams-wrap { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:.5rem 0 .75rem; }
    .team-col h3 { margin:.25rem 0 .25rem; font-size:1em; }
    .team-col ul { border-top:1px solid var(--rule); margin-top:.25rem; }
    .team-col li { border-bottom:1px solid var(--rule); padding:.35rem 0; }
    .pill { display:inline-block; padding:.1rem .4rem; border:1px solid var(--rule); border-radius:999px; font-size:.8em; color:var(--muted); margin-left:.35rem; }

    /* Responsive: side banner becomes top banner on narrow screens */
    @media (max-width:1100px) {
      #side-banner { position: static; max-width: 100%; margin-bottom:12px; }
      .teams-wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Sticky / floating banner -->
  <aside id="side-banner">
    I hope you enjoy this project — a one-stop hub for consolidated sports data, presented simply for bettors and fantasy players.
  </aside>

  <div id="attrib">Data source: ESPN public score APIs (unofficial/open endpoints).</div>

  <h1 id="title">Scorers — Current</h1>
  <div id="auto-note" class="small"></div>

  <div id="controls">
    <label for="sportSelect">Sport:</label>
    <select id="sportSelect">
      <option value="nfl">NFL</option>
      <option value="mlb">MLB</option>
      <option value="nba">NBA</option>
    </select>

    <label for="viewMode">View:</label>
    <select id="viewMode">
      <option value="players">Players (list)</option>
      <option value="matchups">By matchup (accordion)</option>
    </select>

    <!-- NFL only -->
    <span id="controlsNFL">
      <label for="weekSelect">Week:</label>
      <select id="weekSelect"></select>
      <label for="csvSeason">CSV season:</label>
      <select id="csvSeason"></select>
      <button id="nflCsvBtn" type="button" title="Every player who touched the ball, every week played so far, plus pregame rows for the upcoming week">Download season CSV</button>
      <span id="nflCsvStatus" class="small"></span>
    </span>

    <!-- MLB only: stat selector -->
    <span id="controlsMLB" class="hidden">
      <label for="mlbStat">MLB Stat:</label>
      <select id="mlbStat">
        <option value="tb">Total Bases</option>
        <option value="rbi">RBIs</option>
        <option value="r">Runs</option>
        <option value="h">Hits</option>
        <option value="hr">Home Runs</option>
      </select>
    </span>

    <!-- NBA only: stat + date selector for matchups -->
    <span id="controlsNBA" class="hidden">
      <label for="nbaStat">NBA Stat:</label>
      <select id="nbaStat">
        <option value="pts">Points</option>
        <option value="reb">Rebounds</option>
        <option value="ast">Assists</option>
        <option value="3pm">3-Pointers Made</option>
      </select>

      <label for="nbaDate">Date (matchups):</label>
      <select id="nbaDate"></select>
    </span>

    <!-- Players-only controls (all sports) -->
    <span id="controlsPlayers">
      <label for="teamFilter">Team:</label>
      <select id="teamFilter">
        <option value="">All teams</option>
      </select>

      <label for="sortMode">Sort:</label>
      <select id="sortMode">
        <option value="stat">By selected stat</option>
        <option value="name">A–Z by player</option>
      </select>
    </span>
  </div>

  <!-- Leaders ribbon -->
  <div id="leadersWrap" hidden>
    <h2>Leaders (Top 5)</h2>
    <div id="leaders"></div>
  </div>

  <div id="stamp" class="small"></div>
  <div id="status">Loading…</div>

  <!-- Players view -->
  <ul id="list"></ul>

  <!-- Matchups view -->
  <div id="gamesWrap" hidden>
    <h2>By Matchup (expand to view)</h2>
    <div id="games"></div>
  </div>

  <script>
  (async function () {
    const titleEl = document.getElementById('title');
    const status  = document.getElementById('status');
    const list    = document.getElementById('list');
    const stamp   = document.getElementById('stamp');
    const autoNote= document.getElementById('auto-note');

    const sportSelectEl  = document.getElementById('sportSelect');
    const viewModeEl     = document.getElementById('viewMode');
    const weekSelectEl   = document.getElementById('weekSelect');
    const controlsNFL    = document.getElementById('controlsNFL');
    const controlsMLB    = document.getElementById('controlsMLB');
    const controlsNBA    = document.getElementById('controlsNBA');
    const controlsPlayers= document.getElementById('controlsPlayers');
    const nbaDateEl      = document.getElementById('nbaDate');

    const teamFilterEl   = document.getElementById('teamFilter');
    const sortModeEl     = document.getElementById('sortMode');
    const mlbStatEl      = document.getElementById('mlbStat');
    const nbaStatEl      = document.getElementById('nbaStat');

    const gamesWrapEl    = document.getElementById('gamesWrap');
    const gamesEl        = document.getElementById('games');

    const leadersWrapEl  = document.getElementById('leadersWrap');
    const leadersEl      = document.getElementById('leaders');

    const TOTAL_REG_WEEKS = 18; // NFL regular season

    // App state
    let sport = 'nfl';              // 'nfl' | 'mlb' | 'nba'
    let currentSeasonYear = null;   // NFL season year
    let currentSeasonType = 2;      // NFL: 1=Pre,2=Reg,3=Post
    let currentWeek = null;         // NFL current week
    let activeWeek = null;          // NFL selected week
    let refreshTimer = null;

    // NBA window (always last 7 days aggregated for Players; specific day for Matchups)
    let nbaDates = [];  // array of {label, yyyymmdd}
    let nbaSelectedDate = null; // yyyymmdd for matchups

    // Data for current render
    let currentItems = []; // array of { label,name,abbr,logo,statValue, byType | mlb | nba }
    let currentGames = []; // per-game structures for accordion

    // ---------- endpoint helpers ----------
    const urls = {
      nfl: {
        scoreboard: (opts={}) => {
          const u = new URL('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
          if (opts.seasontype) u.searchParams.set('seasontype', String(opts.seasontype));
          if (opts.week)       u.searchParams.set('week', String(opts.week));
          if (opts.year)       u.searchParams.set('year', String(opts.year));
          return u.toString();
        },
        summary: (eventId) =>
          `https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${eventId}`
      },
      mlb: {
        scoreboard: () => 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
        summary: (eventId) =>
          `https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=${eventId}`
      },
      nba: {
        scoreboard: (yyyymmdd) => {
          const u = new URL('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard');
          if (yyyymmdd) u.searchParams.set('dates', yyyymmdd);
          return u.toString();
        },
        summary: (eventId) =>
          `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${eventId}`
      }
    };

    // ---------- utilities ----------
    const fmt = {
      yyyymmdd(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}${m}${day}`;
      },
      niceDate(d) {
        return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
      }
    };

    // ---------- labels ----------
    function statLabelShortMLB(code){ return {tb:'TB', rbi:'RBI', r:'R', h:'H', hr:'HR'}[code] || 'Stat'; }
    function statLabelLongMLB(code){  return {tb:'Total Bases', rbi:'RBIs', r:'Runs', h:'Hits', hr:'Home Runs'}[code] || 'Stat'; }
    function statLabelShortNBA(code){ return {pts:'PTS', reb:'REB', ast:'AST', '3pm':'3PM'}[code] || 'Stat'; }
    function statLabelLongNBA(code){  return {pts:'Points', reb:'Rebounds', ast:'Assists', '3pm':'3-Pointers Made'}[code] || 'Stat'; }

    function labelShortForSport() {
      if (sport === 'nfl') return 'TD';
      if (sport === 'mlb') return statLabelShortMLB(mlbStatEl.value);
      return statLabelShortNBA(nbaStatEl.value);
    }

    function buildBreakdownLine(row) {
      if (sport === 'nfl') {
        return Object.entries(row.byType || {})
          .sort((a,b)=>b[1]-a[1])
          .map(([k,v]) => `${k.replace(' Return',' Ret')}: ${v}`)
          .join(' • ');
      }
      if (sport === 'mlb') {
        const s = row.mlb || {h:0,r:0,rbi:0,tb:0,hr:0};
        return `TB ${s.tb} • RBI ${s.rbi} • R ${s.r} • H ${s.h} • HR ${s.hr}`;
      }
      const s = row.nba || {pts:0,reb:0,ast:0,tpm:0};
      return `PTS ${s.pts} • REB ${s.reb} • AST ${s.ast} • 3PM ${s.tpm}`;
    }

    function setTitleForContext() {
      if (sport === 'nfl') {
        const label = (activeWeek ? `Week ${activeWeek} of ${TOTAL_REG_WEEKS}` : 'Current Week');
        titleEl.textContent = `NFL — ${viewModeEl.value === 'players' ? 'TD Scorers' : 'Matchups'} — ${label}`;
      } else if (sport === 'mlb') {
        const statName = statLabelLongMLB(mlbStatEl.value);
        titleEl.textContent = `MLB — ${viewModeEl.value === 'players' ? `${statName} Leaders (Today)` : `Matchups — ${statName} (Today)`}`;
      } else {
        const statName = statLabelLongNBA(nbaStatEl.value);
        if (viewModeEl.value === 'players') {
          titleEl.textContent = `NBA — ${statName} Leaders — Last 7 Days`;
        } else {
          const sel = nbaDates.find(x => x.value === nbaSelectedDate);
          titleEl.textContent = `NBA — Matchups (${statName}) — ${sel ? sel.label : ''}`;
        }
      }
    }

    function setAutoNote() {
      if (sport === 'nfl') {
        autoNote.textContent = (activeWeek === currentWeek)
          ? 'Auto-refreshing current NFL week every 2 minutes.'
          : 'Viewing historical NFL week (auto-refresh paused).';
      } else if (sport === 'mlb') {
        autoNote.textContent = 'Auto-refreshing today’s MLB games every 2 minutes.';
      } else {
        autoNote.textContent = 'NBA Players: last 7 days aggregated (refreshing every 2 minutes). NBA Matchups: shows a chosen day (last 7).';
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      if (sport === 'nfl') {
        if (activeWeek === currentWeek) refreshTimer = setInterval(() => loadData(), 120000);
      } else {
        refreshTimer = setInterval(() => loadData(), 120000);
      }
      setAutoNote();
    }
    function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

    function populateWeekDropdown(currWeek) {
      weekSelectEl.innerHTML = '';
      for (let w = 1; w <= TOTAL_REG_WEEKS; w++) {
        const opt = document.createElement('option');
        opt.value = String(w);
        opt.textContent = `Week ${w}`;
        if (w === currWeek) opt.selected = true;
        weekSelectEl.appendChild(opt);
      }
    }

    // Build last 7 days list for NBA (today..today-6)
    function buildNBADates() {
      nbaDates = [];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        nbaDates.push({ value: fmt.yyyymmdd(d), label: fmt.niceDate(d) });
      }
      nbaSelectedDate = nbaDates[0].value;
      nbaDateEl.innerHTML = nbaDates.map(d => `<option value="${d.value}">${d.label}</option>`).join('');
    }

    // ---------- sport-specific extractors ----------
    function tdCategoryNFL(p) {
      const txt = (p.text || '').toLowerCase();
      const typ = String(p?.type?.text || '').toLowerCase();
      if (/passing touchdown/.test(typ)) return 'Receiving';
      if (/rushing touchdown/.test(typ)) return 'Rushing';
      if (/interception return/.test(typ)) return 'INT Return';
      if (/fumble return/.test(typ)) return 'Fumble Return';
      if (/kickoff return|punt return|blocked punt/.test(typ)) return 'Return';
      const players = Array.isArray(p.players) ? p.players : [];
      const types = players.map(x => (x?.type?.text || '').toLowerCase()).join(' ');
      if (/receive|reception|receiver/.test(types)) return 'Receiving';
      if (/rush|rusher|run/.test(types)) return 'Rushing';
      if (/kickoff return|punt return|returner/.test(types)) return 'Return';
      if (/interception/.test(types)) return 'INT Return';
      if (/fumble/.test(types)) return 'Fumble Return';
      if (/(pass|from)/.test(txt) && !/interception/.test(txt)) return 'Receiving';
      if (/\brun|\brush|\bkeeper/.test(txt)) return 'Rushing';
      if (/kickoff return|punt return/.test(txt)) return 'Return';
      if (/interception.*return|pick[- ]?six/.test(txt)) return 'INT Return';
      if (/fumble.*return|fumble.*recovery/.test(txt)) return 'Fumble Return';
      return 'TD';
    }

    // NFL: is this scoring play a touchdown?
    function isTouchdownNFL(p) {
      if (p?.scoringType?.name) return p.scoringType.name === 'touchdown';
      const text = String(p?.text || '');
      return String(p?.type?.text || '').toLowerCase().includes('touchdown') || /\btd\b|touchdown/i.test(text)
        || /\([^)]*\b(kick|pat|two-point|2-pt)\b[^)]*\)\s*$/i.test(text); // followed by an extra-point try

    }

    // NFL: pull the scorer's name out of the play text.
    // Handles "Parker Washington 50 Yd pass from ...", "Gracen Halton Fumble Recovery in End Zone",
    // and play-by-play style "(No Huddle) J.Gibbs up the middle for 1 yard, TOUCHDOWN."
    function parseScorerNameNFL(p) {
      const named = (Array.isArray(p?.players) ? p.players : []).find(x => x?.athlete?.displayName);
      if (named) return named.athlete.displayName;
      let t = String(p?.text || '').replace(/^(\([^)]*\)\s*)+/, '').trim();
      let m;
      // Older ESPN formats: "AJ Barner Pass From Geno Smith for 9 Yds",
      // "Blocked Kick Recovered by Jordan Davis (PHI) ...", "C.J. Stroud Aborted Snap C.J. Stroud Fumble Woody Marks 1 Yd ..."
      if ((m = /^(.+?)\s+Pass From\b/.exec(t))) return m[1].trim();
      if ((m = /\bRecovered by\s+(.+?)\s*\(/.exec(t))) return m[1].trim();
      if (/\bAborted\b/.test(t)) t = t.replace(/^.*\bFumble\s+(?=[A-Z][\w'.\-]+\s+[A-Z][\w'.\-]+.*?\d+\s*Yd)/, '');
      // Laterals: the last player to receive the ball scored.
      const laterals = [...t.matchAll(/\blateral(?:ed)?\s+to\s+([A-Z][\w'.\-]*(?:\s+[A-Z][\w'.\-]*)*?)\s+for\b/g)];
      if (laterals.length) return laterals[laterals.length - 1][1].trim();
      if (/TOUCHDOWN|\bcomplete pass to\b/.test(t)) {
        m = /\bpass\b.*?\bto\s+([A-Z][\w'.\-]*(?:\s+[A-Z][\w'.\-]*)*?)\s+(?:for|to|at|in|pushed|ran)\b/.exec(t)
         || /^([A-Z][\w'\-]*\.\s?[A-Z][\w'.\-]*)/.exec(t);
        if (m) return m[1].trim();
      }
      m = /^(.+?)\s+\d+\s*(?:yd|yard)/i.exec(t)
       || /^(.+?)\s+(?:fumble|interception|punt|kickoff|blocked|recovery|recovered|return|returned|pass|rush|run)\b/i.exec(t);
      return m ? m[1].trim() : 'Unknown';
    }

    // NFL: index the game's boxscore roster (every stat group) so names can be matched to players.
    function buildRosterNFL(summaryJson) {
      const byTeam = new Map(); // teamId -> [{id,first,last,display}]
      for (const block of (summaryJson?.boxscore?.players || [])) {
        const tid = String(block?.team?.id || '');
        const seen = byTeam.get(tid) || [];
        for (const g of (block?.statistics || [])) for (const a of (g?.athletes || [])) {
          const at = a?.athlete; if (!at?.displayName) continue;
          let e = seen.find(s => s.display === at.displayName);
          if (!e) { e = { id: String(at.id || ''), first: at.firstName || '', last: at.lastName || '', display: at.displayName, groups: new Set() }; seen.push(e); }
          e.groups.add(g.name); // passing / rushing / receiving / ...
        }
        byTeam.set(tid, seen);
      }
      return byTeam;
    }

    const normNameNFL = s => String(s || '').toLowerCase()
      .replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '').replace(/[^a-z]/g, '');

    // Expand abbreviated names ("J.Gibbs", "Ja.Chase", "A.St. Brown") and normalize suffixes
    // ("Deebo Samuel" vs "Deebo Samuel Sr.") to ESPN's roster name.
    // preferGroup ('rushing' / 'receiving') breaks ties like two "C.Williams" on one team.
    function findRosterPlayerNFL(name, teamId, roster, preferGroup) {
      const players = roster?.get(String(teamId)) || [];
      const m = /^([A-Z][a-z]?)\.\s?(.+)$/.exec(name);
      if (m) {
        const hits = players.filter(a => a.first.toLowerCase().startsWith(m[1].toLowerCase()) && normNameNFL(a.last) === normNameNFL(m[2]));
        if (hits.length === 1) return hits[0];
        if (hits.length > 1 && preferGroup) {
          const inGroup = hits.filter(a => a.groups?.has(preferGroup));
          if (inGroup.length === 1) return inGroup[0];
        }
      }
      const hits = players.filter(a => normNameNFL(a.display) === normNameNFL(name));
      if (hits.length === 1) return hits[0];
      // Nicknames ("Z.Knight" = Bam Knight): accept a unique last-name match on that team.
      if (m) {
        const byLast = players.filter(a => normNameNFL(a.last) === normNameNFL(m[2]));
        if (byLast.length === 1) return byLast[0];
      }
      return null;
    }
    function resolveNameNFL(name, teamId, roster) {
      return findRosterPlayerNFL(name, teamId, roster)?.display || name;
    }

    // Play-by-play: who carried the ball / was targeted. Returns {kind:'rush'|'target', name} or null.
    const PBP_NAME = "([A-Z][a-z]?\\.\\s?(?:St\\.\\s?)?[A-Z][\\w'\\-]+)";
    function pbpOpportunityNFL(play) {
      const typ = String(play?.type?.text || '');
      let t = String(play?.text || '');
      if (/\bno play\b/i.test(t)) return null;
      t = t.replace(/\([^)]*\)/g, ' ')                                  // (Shotgun), (tacklers)
           .replace(/^.*?reported in as eligible\.\s*/i, ' ')           // "X and Y reported in as eligible."
           .replace(/Direct snap to [A-Z][a-z]?\.\s?[\w'\-]+\.\s*/gi, ' ')
           .trim();
      const FULL = "([A-Z][\\w'.\\-]+(?:\\s+[A-Z][\\w'.\\-]+){1,3}?)";
      if (/^(Rush|Rushing Touchdown)$/.test(typ)) {
        if (/\bkneels\b/i.test(t)) return null; // kneel-downs aren't scoring opportunities
        const m = new RegExp('^' + PBP_NAME).exec(t)
               || new RegExp('^' + FULL + '\\s+\\d+\\s+Yd\\s+(?:Rush|Run)\\b').exec(t)
               || new RegExp('^' + FULL + '\\s+(?:Run|Rush|run|rush|scrambles|kneels|left|right|up)\\b').exec(t); // "Ashton Jeanty Run for 3 Yds"
        return m ? { kind: 'rush', name: m[1] } : null;
      }
      if (/^(Pass Reception|Pass Incompletion|Passing Touchdown|Pass Interception Return|Interception Return Touchdown)$/.test(typ)) {
        const m = new RegExp('^' + FULL + '\\s+\\d+\\s+Yd\\s+pass\\s+from\\b').exec(t)                // "Dontayvion Wicks 9 Yd pass from Jalen Hurts"
               || new RegExp('\\bpass\\b[^.]*?\\b(?:to|intended for)\\s+' + PBP_NAME).exec(t)
               || new RegExp('\\bPass\\b[^.]*?\\b(?:to|intended for)\\s+' + FULL + '(?=\\s+[a-z(]|[.,]|$)').exec(t); // "Pass Complete for 5 Yds to Michael Mayer"
        return m ? { kind: 'target', name: m[1] } : null;
      }
      return null;
    }

    // Yards from the end zone at the snap. ESPN's numeric field is occasionally wrong (e.g. Rams–Chargers,
    // who share a stadium), so prefer the "LAC 19" possession text when it names one of the two teams.
    function yardsToEndzoneNFL(play, offAbbr, teamAbbrs) {
      const s = play?.start || {};
      const m = /^([A-Z]{2,4})\s+(\d+)$/.exec(s.possessionText || '');
      if (m && offAbbr && teamAbbrs.includes(m[1])) return m[1] === offAbbr ? 100 - +m[2] : +m[2];
      if (s.possessionText === '50') return 50;
      return typeof s.yardsToEndzone === 'number' && s.yardsToEndzone > 0 ? s.yardsToEndzone : null;
    }

    function parseCSV(text) {
      const rows = []; let row = [], field = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
          else field += c;
        } else if (c === '"') q = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); rows.push(row); row = []; field = '';
        } else field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      const [h, ...rest] = rows;
      if (!h) return [];
      return rest.filter(r => r.length === h.length).map(r => Object.fromEntries(h.map((k, i) => [k, r[i]])));
    }

    // ---------- NFL season CSV ----------
    // nflverse (github.com/nflverse) supplies snap counts and injury/practice reports.
    // Their files can't be fetched cross-origin, so copies live in this repo's data/ folder.
    const NFLVERSE_TEAM = { WSH: 'WAS', LAR: 'LA' }; // ESPN -> nflverse abbreviations
    async function loadNflverseNFL(season) {
      const get = async name => {
        try {
          const r = await fetch(`data/${name}_${season}.csv`, { cache: 'no-cache' });
          return r.ok ? parseCSV(await r.text()) : [];
        } catch { return []; }
      };
      const [snaps, injuries] = await Promise.all([get('snap_counts'), get('injuries')]);
      const snapBy = new Map(), injBy = new Map(), injWeeks = new Set();
      for (const s of snaps) {
        if (s.game_type !== 'REG') continue;
        snapBy.set(`${+s.week}|${s.team}|${normNameNFL(s.player)}`,
          { snaps: +s.offense_snaps || 0, pct: Math.round((parseFloat(s.offense_pct) || 0) * 100), pos: s.position });
      }
      for (const r of injuries) {
        if (r.game_type !== 'REG') continue;
        injWeeks.add(`${+r.week}|${r.team}`);
        injBy.set(`${+r.week}|${r.team}|${normNameNFL(r.full_name)}`,
          { report: r.report_status, practice: r.practice_status, pos: r.position });
      }
      // Fallback index by last name, for first-name differences ("Josh" vs "Joshua", "Hollywood" vs "Marquise").
      // If several players share the last name, pick the one whose first name is compatible ("Gabe"/"Gabriel").
      const firstKey = n => normNameNFL(String(n || '').trim().split(/\s+/)[0]);
      const byLast = map => {
        const out = new Map();
        for (const [k, v] of map) {
          const [wk, tm] = k.split('|');
          const lk = `${wk}|${tm}|${v.last}`;
          if (!out.has(lk)) out.set(lk, []);
          out.get(lk).push(v);
        }
        return out;
      };
      for (const s of snaps) { const v = snapBy.get(`${+s.week}|${s.team}|${normNameNFL(s.player)}`); if (v) { v.last = lastNameKeyNFL(s.player); v.first = firstKey(s.player); } }
      for (const r of injuries) { const v = injBy.get(`${+r.week}|${r.team}|${normNameNFL(r.full_name)}`); if (v) { v.last = lastNameKeyNFL(r.full_name); v.first = firstKey(r.full_name); } }
      const snapByLast = byLast(snapBy), injByLast = byLast(injBy);
      const find = (map, lastMap, week, team, name) => {
        const exact = map.get(`${week}|${team}|${normNameNFL(name)}`);
        if (exact) return exact;
        const cands = lastMap.get(`${week}|${team}|${lastNameKeyNFL(name)}`) || [];
        if (cands.length === 1) return cands[0];
        const f = firstKey(name);
        const compat = cands.filter(c => c.first && f && (c.first.startsWith(f) || f.startsWith(c.first)));
        if (compat.length === 1) return compat[0];
        const initial = cands.filter(c => c.first && f && c.first[0] === f[0]); // "Gabe" vs "Gabriel"
        return initial.length === 1 ? initial[0] : null;
      };
      return {
        snap: (w, t, n) => find(snapBy, snapByLast, w, t, n),
        injury: (w, t, n) => find(injBy, injByLast, w, t, n),
        injWeeks, hasSnaps: snaps.length > 0, hasInjuries: injuries.length > 0
      };
    }
    function lastNameKeyNFL(name) {
      const parts = String(name || '').replace(/\b(Jr|Sr|II|III|IV|V)\b\.?/g, '').trim().split(/\s+/);
      return normNameNFL(parts[parts.length - 1]);
    }

    async function loadPositionsNFL(teamIds) {
      const byId = new Map();
      await Promise.all([...teamIds].map(async tid => {
        try {
          const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${tid}/roster`).then(x => x.json());
          for (const grp of (r.athletes || [])) for (const a of (grp.items || [])) {
            if (a?.id && a?.position?.abbreviation) byId.set(String(a.id), a.position.abbreviation);
          }
        } catch { /* positions fall back to nflverse */ }
      }));
      return byId;
    }

    // nflverse schedule: betting lines and rest days for every season (served with CORS).
    let nflverseGamesCache = null;
    async function loadNflverseGames() {
      if (!nflverseGamesCache) {
        nflverseGamesCache = fetch('https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv')
          .then(r => r.ok ? r.text() : '').then(parseCSV).catch(() => []);
      }
      const byEspnId = new Map();
      for (const g of await nflverseGamesCache) if (g.espn && g.espn !== 'NA') byEspnId.set(String(g.espn), g);
      return byEspnId;
    }

    // One row per player per game: everyone who passed, ran, was targeted, or scored a TD,
    // for every regular-season week played so far, plus pregame-only rows for the upcoming week.
    // Every "Prior", "Last 3", "Team Prior" and "Opp" column uses only games completed before that week.
    async function buildNFLSeasonCSV(season, onProgress) {
      const isCurrent = season === currentSeasonYear;
      const lastWeek = !isCurrent ? TOTAL_REG_WEEKS
                     : currentSeasonType === 2 ? currentWeek
                     : currentSeasonType >= 3 ? TOTAL_REG_WEEKS : 0;
      if (!lastWeek) throw new Error('No regular-season weeks have been played yet.');
      const sbUrl = w => {
        const u = new URL('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
        u.searchParams.set('seasontype', '2'); u.searchParams.set('week', String(w));
        if (isCurrent) u.searchParams.set('year', String(season)); else u.searchParams.set('dates', String(season));
        return u.toString();
      };

      // 1) Scoreboards -> games played (and the upcoming week's scheduled games)
      const games = [], upcoming = [], teamIds = new Set();
      for (let w = 1; w <= lastWeek; w++) {
        onProgress(`Loading ${season} schedule: week ${w} of ${lastWeek}…`);
        const sb = await fetch(sbUrl(w)).then(r => r.json());
        for (const ev of (sb.events || [])) {
          const comp = ev?.competitions?.[0];
          const st = comp?.status?.type || ev?.status?.type || {};
          const sides = {};
          for (const c of (comp?.competitors || [])) {
            const tid = String(c?.team?.id);
            teamIds.add(tid);
            sides[tid] = { abbr: c?.team?.abbreviation || '', homeAway: c?.homeAway === 'home' ? 'Home' : 'Away' };
          }
          const g = { week: w, id: String(ev.id), date: ev.date, completed: !!st.completed, sides,
                      status: st.completed ? 'Final' : st.state === 'pre' ? 'Scheduled' : (st.shortDetail || 'In progress') };
          if (st.state === 'pre') { if (isCurrent && w === lastWeek) upcoming.push(g); }
          else games.push(g);
        }
      }
      if (!games.length && !upcoming.length) throw new Error('No games found for this season.');

      onProgress('Loading rosters, betting lines, snap counts and injury reports…');
      const [positions, nv, nvGames] = await Promise.all([
        loadPositionsNFL(teamIds), loadNflverseNFL(season), loadNflverseGames()
      ]);

      const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
      const abbrsOf = g => Object.keys(g.sides).map(t => g.sides[t].abbr);

      // Lines + rest days per team for a game: nflverse schedule first, ESPN pickcenter as fallback.
      function gameContext(g, summary) {
        const out = {};
        const tids = Object.keys(g.sides);
        const nvg = nvGames.get(g.id);
        if (nvg && nvg.spread_line !== 'NA' && nvg.spread_line !== '' && nvg.total_line !== 'NA' && nvg.total_line !== '') {
          const homeFav = num(nvg.spread_line), total = num(nvg.total_line); // spread_line > 0: home favored
          for (const tid of tids) {
            const home = g.sides[tid].homeAway === 'Home';
            const spread = home ? -homeFav : homeFav;
            out[tid] = { total, spread, implied: total / 2 - spread / 2 };
          }
        } else {
          const pc = (summary?.pickcenter || [])[0];
          if (pc && Number.isFinite(pc.overUnder)) {
            const m = /^([A-Z]{2,4})\s+(-?\d+(?:\.\d+)?)/.exec(pc.details || '');
            const favAbbr = m ? m[1] : null, line = m ? Math.abs(parseFloat(m[2])) : 0;
            for (const tid of tids) {
              const spread = favAbbr ? (g.sides[tid].abbr === favAbbr ? -line : line) : 0;
              out[tid] = { total: pc.overUnder, spread, implied: pc.overUnder / 2 - spread / 2 };
            }
          }
        }
        if (nvg) for (const tid of tids) {
          const rest = g.sides[tid].homeAway === 'Home' ? nvg.home_rest : nvg.away_rest;
          (out[tid] ||= {}).rest = rest && rest !== 'NA' ? +rest : '';
        }
        return out;
      }

      // 2) Game summaries
      const rows = new Map();
      const teamGames = new Map(); // `${gameId}|${teamId}` -> offense + allowed stats (completed games)
      const diag = { rzUnmatched: [] };
      const ensureRowFor = (g, ctx) => (tid, player) => {
        const key = `${g.id}|${tid}|${player.id || player.display}`;
        if (!rows.has(key)) {
          const tids = Object.keys(g.sides), oppId = tids.find(t => t !== tid);
          rows.set(key, {
            week: g.week, date: g.date, status: g.status, gameId: g.id, completed: g.completed, upcoming: g.status === 'Scheduled',
            pid: player.id || `name:${player.display}`, name: player.display,
            teamId: tid, team: g.sides[tid]?.abbr || '', oppId, opp: oppId ? g.sides[oppId].abbr : '',
            homeAway: g.sides[tid]?.homeAway || '', ctx: ctx[tid] || {},
            rushing: 0, receiving: 0, other: 0, otherTypes: new Set(),
            carries: 0, targets: 0, rec: 0, rushYds: 0, recYds: 0, passAtt: 0,
            rzCarries: 0, rzTargets: 0, i10Carries: 0, i10Targets: 0
          });
        }
        return rows.get(key);
      };

      let done = 0;
      const all = [...games, ...upcoming];
      const BATCH = 6;
      for (let i = 0; i < all.length; i += BATCH) {
        await Promise.all(all.slice(i, i + BATCH).map(async g => {
          const data = await fetch(urls.nfl.summary(g.id)).then(r => r.json()).catch(() => ({}));
          const ctx = gameContext(g, data);
          g.ctx = ctx;
          if (g.status === 'Scheduled') { done++; return; }   // upcoming: rows are added in step 3
          const roster = buildRosterNFL(data);
          const tids = Object.keys(g.sides);
          const ensureRow = ensureRowFor(g, ctx);

          // Box score usage
          for (const block of (data?.boxscore?.players || [])) {
            const tid = String(block?.team?.id || '');
            if (!g.sides[tid]) continue;
            for (const grp of (block.statistics || [])) {
              if (!['passing', 'rushing', 'receiving'].includes(grp.name)) continue;
              const keys = grp.keys || [];
              for (const a of (grp.athletes || [])) {
                if (!a?.athlete?.displayName) continue;
                const st = Object.fromEntries(keys.map((k, j) => [k, a.stats?.[j]]));
                const r = ensureRow(tid, { id: String(a.athlete.id || ''), display: a.athlete.displayName });
                if (grp.name === 'rushing')   { r.carries += num(st.rushingAttempts); r.rushYds += num(st.rushingYards); }
                if (grp.name === 'receiving') { r.targets += num(st.receivingTargets); r.rec += num(st.receptions); r.recYds += num(st.receivingYards); }
                if (grp.name === 'passing')   { r.passAtt += num(String(st['completions/passingAttempts'] || '').split('/')[1]); }
              }
            }
          }

          // Touchdowns
          for (const p of (data.scoringPlays || [])) {
            if (!isTouchdownNFL(p)) continue;
            const tid = String(p?.team?.id || '');
            if (!g.sides[tid]) continue;
            const raw = parseScorerNameNFL(p);
            const r = ensureRow(tid, findRosterPlayerNFL(raw, tid, roster) || { id: '', display: raw });
            const cat = tdCategoryNFL(p);
            if (cat === 'Rushing') r.rushing++;
            else if (cat === 'Receiving') r.receiving++;
            else { r.other++; r.otherTypes.add(cat === 'TD' ? 'Other' : cat); }
          }

          // Red zone (<= 20 yards out) and inside-the-10 carries / targets
          for (const dr of (data?.drives?.previous || [])) {
            for (const p of (dr.plays || [])) {
              const tid = String(p?.start?.team?.id || dr?.team?.id || '');
              const ytg = yardsToEndzoneNFL(p, g.sides[tid]?.abbr, abbrsOf(g));
              if (!(ytg !== null && ytg <= 20)) continue;
              const opp = pbpOpportunityNFL(p);
              if (!opp) continue;
              const pl = findRosterPlayerNFL(opp.name, tid, roster, opp.kind === 'rush' ? 'rushing' : 'receiving');
              if (!pl) { diag.rzUnmatched.push(`${g.week} ${g.sides[tid]?.abbr} ${opp.name} | ${p.text}`); continue; }
              const r = ensureRow(tid, pl);
              if (opp.kind === 'rush') { r.rzCarries++; if (ytg <= 10) r.i10Carries++; }
              else { r.rzTargets++; if (ytg <= 10) r.i10Targets++; }
            }
          }

          // Team offense and what each defense allowed (completed games only)
          if (g.completed) {
            const comps = data?.header?.competitions?.[0]?.competitors || [];
            const off = {};
            for (const t of (data?.boxscore?.teams || [])) {
              const sv = n => (t.statistics || []).find(s => s.name === n)?.displayValue;
              const [rzTD, rzTrips] = String(sv('redZoneAttempts') || '0-0').split('-').map(num);
              const tid = String(t?.team?.id);
              off[tid] = { pts: num(comps.find(c => String(c?.team?.id) === tid)?.score),
                           yds: num(sv('totalYards')), plays: num(sv('totalOffensivePlays')),
                           rush: num(sv('rushingYards')), pass: num(sv('netPassingYards')), rzTD, rzTrips };
            }
            for (const tid of tids) {
              const oppId = tids.find(t => t !== tid);
              if (off[tid] && off[oppId]) teamGames.set(`${g.id}|${tid}`, { gameId: g.id, week: g.week, date: g.date, teamId: tid, off: off[tid], allowed: off[oppId] });
            }
          }

          done++;
          onProgress(`Loading ${season} games: ${done} of ${all.length}…`);
        }));
      }

      // 3) Upcoming week: one pregame row per player who appeared in either of the team's last two games.
      if (upcoming.length) {
        const played = [...rows.values()];
        for (const g of upcoming) {
          const ensureRow = ensureRowFor(g, g.ctx || {});
          for (const tid of Object.keys(g.sides)) {
            const weeks = [...new Set(played.filter(r => r.teamId === tid).map(r => r.week))].sort((a, b) => b - a).slice(0, 2);
            const seen = new Set();
            for (const r of played) {
              if (r.teamId !== tid || !weeks.includes(r.week) || seen.has(r.pid)) continue;
              seen.add(r.pid);
              ensureRow(tid, { id: r.pid.startsWith('name:') ? '' : r.pid, display: r.name });
            }
          }
        }
      }

      // 4) Positions, snaps, injuries
      const list = [...rows.values()];
      for (const r of list) {
        const nvTeam = NFLVERSE_TEAM[r.team] || r.team;
        const snap = nv.snap(r.week, nvTeam, r.name), inj = nv.injury(r.week, nvTeam, r.name);
        r.pos = positions.get(r.pid) || snap?.pos || inj?.pos || '';
        r.snaps = snap ? snap.snaps : '';
        r.snapPct = snap ? snap.pct : '';
        const reported = nv.injWeeks.has(`${r.week}|${nvTeam}`);
        r.injury = inj ? (inj.report || 'No game status') : (reported ? 'Not listed' : '');
        r.practice = inj ? (inj.practice || '') : (reported ? 'Not listed' : '');
        r.totalTDs = r.rushing + r.receiving + r.other;
      }
      // Fill a missing position from the same player's other rows (e.g. upcoming games, released players).
      const posByPid = new Map();
      for (const r of list) if (r.pos && !posByPid.has(r.pid)) posByPid.set(r.pid, r.pos);
      for (const r of list) if (!r.pos) r.pos = posByPid.get(r.pid) || '';

      // 5) Team usage per game (for shares) and team history entering each week
      const teamUse = new Map(); // `${gameId}|${teamId}` -> { carries, targets, rz }
      for (const r of list) {
        if (r.upcoming) continue;
        const k = `${r.gameId}|${r.teamId}`;
        const t = teamUse.get(k) || { carries: 0, targets: 0, rz: 0, offTDs: 0 };
        t.carries += r.carries; t.targets += r.targets; t.rz += r.rzCarries + r.rzTargets; t.offTDs += r.rushing + r.receiving;
        teamUse.set(k, t);
      }
      const tg = [...teamGames.values()];
      const teamWeeksPlayed = new Map(); // teamId -> sorted weeks with a completed game
      for (const t of tg) { if (!teamWeeksPlayed.has(t.teamId)) teamWeeksPlayed.set(t.teamId, []); teamWeeksPlayed.get(t.teamId).push(t.week); }
      for (const w of teamWeeksPlayed.values()) w.sort((a, b) => a - b);

      const teamCache = new Map();
      function teamEntering(teamId, week) {
        const k = `${teamId}|${week}`;
        if (teamCache.has(k)) return teamCache.get(k);
        const gs = tg.filter(t => t.teamId === teamId && t.week < week);
        const n = gs.length, s = f => gs.reduce((a, t) => a + f(t), 0);
        const plays = s(t => t.off.plays), trips = s(t => t.off.rzTrips);
        const out = n ? {
          n, pts: s(t => t.off.pts) / n, ypp: plays ? s(t => t.off.yds) / plays : '',
          rzTrips: trips / n, rzTdPct: trips ? 100 * s(t => t.off.rzTD) / trips : '',
          offTDs: s(t => teamUse.get(`${t.gameId}|${t.teamId}`)?.offTDs || 0) / n
        } : { n: 0 };
        teamCache.set(k, out);
        return out;
      }

      // 6) Player history entering each week
      const byPlayer = new Map();
      for (const r of list) { if (!byPlayer.has(r.pid)) byPlayer.set(r.pid, []); byPlayer.get(r.pid).push(r); }
      const avg = (a, f) => a.length ? a.reduce((s, x) => s + f(x), 0) / a.length : '';
      for (const plist of byPlayer.values()) {
        plist.sort((a, b) => a.week - b.week);
        for (let i = 0; i < plist.length; i++) {
          const r = plist[i];
          const prev = plist.slice(0, i).filter(p => !p.upcoming && p.week < r.week);
          const last3 = prev.slice(-3), earlier = prev.slice(0, -3);
          const snapsOf = a => a.filter(p => p.snapPct !== '');
          const use = p => teamUse.get(`${p.gameId}|${p.teamId}`) || { carries: 0, targets: 0, rz: 0 };
          const teamCar = prev.reduce((s, p) => s + use(p).carries, 0);
          const teamTgt = prev.reduce((s, p) => s + use(p).targets, 0);
          const teamRz = prev.reduce((s, p) => s + use(p).rz, 0);
          const sum = f => prev.reduce((s, p) => s + f(p), 0);
          const teamWeeks = (teamWeeksPlayed.get(r.teamId) || []).filter(w => w < r.week);
          const lastPlayed = prev.length ? prev[prev.length - 1].week : null;
          const s3 = avg(snapsOf(last3), p => p.snapPct), sE = avg(snapsOf(earlier), p => p.snapPct);
          r.prior = {
            n: prev.length, tdGames: prev.filter(p => p.totalTDs).length, tds: sum(p => p.totalTDs),
            car: avg(prev, p => p.carries), tgt: avg(prev, p => p.targets),
            rz: avg(prev, p => p.rzCarries + p.rzTargets), i10: avg(prev, p => p.i10Carries + p.i10Targets),
            snap: avg(snapsOf(prev), p => p.snapPct),
            carShare: teamCar ? 100 * sum(p => p.carries) / teamCar : '',
            tgtShare: teamTgt ? 100 * sum(p => p.targets) / teamTgt : '',
            rzShare: teamRz ? 100 * sum(p => p.rzCarries + p.rzTargets) / teamRz : '',
            lastSnap: prev.length && prev[prev.length - 1].snapPct !== '' ? prev[prev.length - 1].snapPct : '',
            l3Snap: s3, snapTrend: s3 !== '' && sE !== '' ? s3 - sE : '',
            l3Car: avg(last3, p => p.carries), l3Tgt: avg(last3, p => p.targets), l3Rz: avg(last3, p => p.rzCarries + p.rzTargets),
            teamGames: teamWeeks.length,
            missed: Math.max(0, teamWeeks.length - prev.length), // team games this season the player didn't appear in
            playedLast: teamWeeks.length ? (lastPlayed === teamWeeks[teamWeeks.length - 1] ? 'Yes' : 'No') : '',
            weeksSince: lastPlayed === null ? '' : r.week - lastPlayed,
            byeLastWeek: r.week > 1 ? ((teamWeeksPlayed.get(r.teamId) || []).includes(r.week - 1) ? 'No' : 'Yes') : ''
          };
        }
      }

      // Weeks listed Out on the injury report before this week (players who sat out have no box-score row,
      // so this reads the injury file directly).
      for (const r of list) {
        const nvTeam = NFLVERSE_TEAM[r.team] || r.team;
        let c = 0;
        for (let w = 1; w < r.week; w++) if (nv.injury(w, nvTeam, r.name)?.report === 'Out') c++;
        r.prior.listedOut = nv.hasInjuries ? c : '';
      }

      // 7) Opponent defense entering each week
      const METRICS = ['pts', 'yds', 'rush', 'pass'];
      const POS_GROUP = { QB: 'QB', RB: 'RB', FB: 'RB', WR: 'WR', TE: 'TE' };
      const posTDs = []; // { week, defId, grp, tds } offensive TDs allowed, by scorer position
      for (const r of list) {
        const grp = POS_GROUP[r.pos], tds = r.rushing + r.receiving;
        if (r.completed && grp && tds) posTDs.push({ week: r.week, defId: r.oppId, grp, tds });
      }
      const rankOf = (entries, v) => 1 + entries.filter(([, o]) => o < v - 1e-9).length; // 1 = fewest allowed; ties share
      const defCache = new Map();
      function defenseEntering(week) {
        if (defCache.has(week)) return defCache.get(week);
        const agg = new Map();
        for (const t of tg) {
          if (t.week >= week) continue;
          const a = agg.get(t.teamId) || { n: 0, pts: 0, yds: 0, rush: 0, pass: 0, rzTD: 0, rzTrips: 0, QB: 0, RB: 0, WR: 0, TE: 0, weeks: [], through: '' };
          a.n++; for (const k of METRICS) a[k] += t.allowed[k];
          a.rzTD += t.allowed.rzTD; a.rzTrips += t.allowed.rzTrips;
          a.weeks.push(t.week); if (t.date > a.through) a.through = t.date;
          agg.set(t.teamId, a);
        }
        for (const p of posTDs) if (p.week < week && agg.has(p.defId)) agg.get(p.defId)[p.grp] += p.tds;
        const out = new Map();
        for (const k of [...METRICS, 'QB', 'RB', 'WR', 'TE']) {
          const avgs = [...agg.entries()].map(([tid, a]) => [tid, a[k] / a.n]);
          for (const [tid, v] of avgs) {
            if (!out.has(tid)) out.set(tid, {});
            out.get(tid)[k] = rankOf(avgs, v);
            out.get(tid)[k + 'Avg'] = v;
          }
        }
        for (const [tid, a] of agg) {
          const o = out.get(tid);
          o.n = a.n; o.through = a.through; o.rzTdPct = a.rzTrips ? 100 * a.rzTD / a.rzTrips : '';
          // Recent form: TDs allowed to each position over the defense's last 3 and last 5 games
          const ws = [...a.weeks].sort((x, y) => y - x);
          for (const [label, nGames] of [['L3', 3], ['L5', 5]]) {
            const recent = new Set(ws.slice(0, nGames));
            for (const grp of ['QB', 'RB', 'WR', 'TE']) {
              const tds = posTDs.filter(p => p.defId === tid && p.grp === grp && recent.has(p.week)).reduce((s, p) => s + p.tds, 0);
              o[grp + label] = recent.size ? tds / recent.size : '';
            }
          }
        }
        defCache.set(week, out);
        return out;
      }

      // 8) CSV text
      const header = [
        'Season','Week','Game Date','Game Status','Player','Position','Team','Opponent','Home/Away',
        // outcomes (blank for upcoming games)
        'Scored TD','Total TDs','Rushing TDs','Receiving TDs','Other TDs','TD Types',
        'Carries','Targets','Receptions','Rush Yds','Rec Yds','Pass Att',
        'RZ Carries','RZ Targets','Inside-10 Carries','Inside-10 Targets','Off Snaps','Off Snap %',
        // pregame: game context
        'Team Implied Pts','Team Spread','Game Total','Rest Days',
        'Injury Report Status','Practice Status',
        // pregame: player history (earlier weeks only)
        'Prior Games','Prior TD Games','Prior TDs',
        'Prior Avg Carries','Prior Avg Targets','Prior Avg RZ Opps','Prior Avg Inside-10 Opps','Prior Avg Snap %',
        'Prior Carry Share %','Prior Target Share %','Prior RZ Opp Share %',
        'Last Game Snap %','Last 3 Avg Snap %','Snap % Trend (Last 3 vs Earlier)',
        'Last 3 Avg Carries','Last 3 Avg Targets','Last 3 Avg RZ Opps',
        // pregame: availability
        'Team Prior Games','Prior Games Missed','Prior Weeks Listed Out','Played Team\'s Last Game','Weeks Since Last Game','Team Bye Last Week',
        // pregame: team offense
        'Team Prior Pts/G','Team Prior Yds/Play','Team Prior RZ Trips/G','Team Prior RZ TD %','Team Prior Off TDs/G',
        // pregame: opponent defense
        'Opp Def Games Used','Opp Def Stats Through',
        'Opp Def Rank: Points Allowed','Opp Def Rank: Total Yds Allowed','Opp Def Rank: Rush Yds Allowed','Opp Def Rank: Pass Yds Allowed',
        'Opp RZ TD % Allowed',
        'Opp TDs Allowed/G to Position','Opp Def Rank: TDs Allowed to Position',
        'Opp TDs Allowed/G to Position (Last 3)','Opp TDs Allowed/G to Position (Last 5)'
      ];
      const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const r1 = v => v === '' || v === undefined || v === null ? '' : Math.round(v * 10) / 10;
      const r2 = v => v === '' || v === undefined || v === null ? '' : Math.round(v * 100) / 100;
      const ymd = iso => { if (!iso) return ''; const d = new Date(iso); return fmt.yyyymmdd(d).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'); };
      list.sort((a, b) => a.week - b.week || (b.totalTDs - a.totalTDs) || a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
      const lines = [header.join(',')];
      for (const r of list) {
        const types = [];
        if (r.rushing) types.push('Rushing');
        if (r.receiving) types.push('Receiving');
        types.push(...r.otherTypes);
        const def = defenseEntering(r.week).get(String(r.oppId)) || {};
        const team = teamEntering(r.teamId, r.week);
        const grp = POS_GROUP[r.pos];
        const P = r.prior, c = r.ctx || {};
        const outcome = v => r.upcoming ? '' : v;
        lines.push([
          season, r.week, ymd(r.date), r.status, r.name, r.pos, r.team, r.opp, r.homeAway,
          outcome(r.totalTDs ? 1 : 0), outcome(r.totalTDs), outcome(r.rushing), outcome(r.receiving), outcome(r.other), outcome(types.join(' + ')),
          outcome(r.carries), outcome(r.targets), outcome(r.rec), outcome(r.rushYds), outcome(r.recYds), outcome(r.passAtt),
          outcome(r.rzCarries), outcome(r.rzTargets), outcome(r.i10Carries), outcome(r.i10Targets), outcome(r.snaps), outcome(r.snapPct),
          r1(c.implied), c.spread ?? '', c.total ?? '', c.rest ?? '',
          r.injury, r.practice,
          P.n, P.tdGames, P.tds,
          r1(P.car), r1(P.tgt), r1(P.rz), r1(P.i10), r1(P.snap),
          r1(P.carShare), r1(P.tgtShare), r1(P.rzShare),
          P.lastSnap, r1(P.l3Snap), r1(P.snapTrend),
          r1(P.l3Car), r1(P.l3Tgt), r1(P.l3Rz),
          P.teamGames, P.missed, P.listedOut, P.playedLast, P.weeksSince, P.byeLastWeek,
          r1(team.pts), r2(team.ypp), r2(team.rzTrips), r1(team.rzTdPct), r2(team.offTDs),
          def.n ?? 0, ymd(def.through),
          ...METRICS.map(k => def[k] ?? ''),
          r1(def.rzTdPct),
          grp ? r2(def[grp + 'Avg']) : '', grp ? (def[grp] ?? '') : '',
          grp ? r2(def[grp + 'L3']) : '', grp ? r2(def[grp + 'L5']) : ''
        ].map(esc).join(','));
      }
      const playedWeeks = games.length ? Math.max(...games.map(g => g.week)) : 0;
      window.__nflCsvDiagnostics = { ...diag, hasSnaps: nv.hasSnaps, hasInjuries: nv.hasInjuries, upcomingGames: upcoming.length };
      return { csv: lines.join('\r\n'), weeks: playedWeeks, rowCount: list.length, upcomingWeek: upcoming.length ? lastWeek : null };
    }

    function downloadText(filename, text) {
      const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // MLB: extract hitters from boxscore
    function extractMLBHittersFromBoxscore(summaryJson) {
      const out = {};
      const box = summaryJson?.boxscore;
      if (!box) return out;
      const blocks = Array.isArray(box.players) ? box.players : [];
      for (const block of blocks) {
        const teamAbbr = block?.team?.abbreviation || '';
        const statGroups = Array.isArray(block?.statistics) ? block.statistics : [];
        const batting = statGroups.find(g =>
          /batting/i.test(g?.name || '') ||
          (Array.isArray(g?.labels) && g.labels.some(l => /H|RBI|TB|AB|R|HR/.test(l)))
        );
        if (!batting) continue;
        const athletes = Array.isArray(batting.athletes) ? batting.athletes : [];
        for (const a of athletes) {
          const name = a?.athlete?.displayName || a?.athlete?.shortName; if (!name) continue;
          let h=0,r=0,rbi=0,tb=0,hr=0;
          const map = a?.statsMap || a?.statisticsMap;
          if (map) {
            h   = parseInt(map.H ?? map.h ?? 0,10)||0;
            r   = parseInt(map.R ?? map.r ?? 0,10)||0;
            rbi = parseInt(map.RBI ?? map.rbi ?? 0,10)||0;
            tb  = parseInt(map.TB ?? map.tb ?? 0,10)||0;
            hr  = parseInt(map.HR ?? map.hr ?? 0,10)||0;
          }
          const labels = batting.labels || a.labels;
          const stats  = a.stats;
          if (Array.isArray(labels) && Array.isArray(stats) && labels.length===stats.length) {
            for (let i=0;i<labels.length;i++) {
              const key = (labels[i]||'').toUpperCase();
              const val = parseInt(String(stats[i]||'').trim(),10);
              if (!Number.isFinite(val)) continue;
              if (key==='H') h=val; else if (key==='R') r=val; else if (key==='RBI') rbi=val; else if (key==='TB') tb=val; else if (key==='HR') hr=val;
            }
          }
          if (!tb && hr>0) tb = 4*hr;
          if (h||r||rbi||tb||hr) {
            if (!out[name]) out[name]={h:0,r:0,rbi:0,tb:0,hr:0,teamAbbr};
            out[name].h+=h; out[name].r+=r; out[name].rbi+=rbi; out[name].tb+=tb; out[name].hr+=hr; out[name].teamAbbr=teamAbbr;
          }
        }
      }
      return out;
    }

    // NBA: extract players (PTS/REB/AST/3PM) from boxscore
    function extractNBAPlayersFromBoxscore(summaryJson) {
      const out = {}; // name -> { pts, reb, ast, tpm, teamAbbr }
      const box = summaryJson?.boxscore;
      if (!box) return out;
      const blocks = Array.isArray(box.players) ? box.players : [];
      for (const block of blocks) {
        const teamAbbr = block?.team?.abbreviation || '';
        const statGroups = Array.isArray(block?.statistics) ? block.statistics : [];
        const g = statGroups.find(gr =>
          /stat/i.test(gr?.name || '') ||
          (Array.isArray(gr?.labels) && gr.labels.some(l => /(PTS|REB|AST|3PT|3PM|FG3M)/i.test(l)))
        );
        if (!g) continue;
        const athletes = Array.isArray(g.athletes) ? g.athletes : [];
        for (const a of athletes) {
          const name = a?.athlete?.displayName || a?.athlete?.shortName; if (!name) continue;
          let pts=0, reb=0, ast=0, tpm=0;

          const labels = Array.isArray(g.labels) ? g.labels : Array.isArray(a.labels) ? a.labels : null;
          const stats  = Array.isArray(a.stats) ? a.stats : null;
          if (labels && stats && labels.length===stats.length) {
            for (let i=0;i<labels.length;i++) {
              const key = (labels[i]||'').toUpperCase();
              const valRaw = String(stats[i] ?? '').trim();
              if (key === 'PTS') { const v=parseInt(valRaw,10); if(Number.isFinite(v)) pts=v; }
              else if (key === 'REB') { const v=parseInt(valRaw,10); if(Number.isFinite(v)) reb=v; }
              else if (key === 'AST') { const v=parseInt(valRaw,10); if(Number.isFinite(v)) ast=v; }
              else if (key === '3PM' || key === 'FG3M') { const v=parseInt(valRaw,10); if(Number.isFinite(v)) tpm=v; }
              else if (key === '3PT') {
                const m = /^(\d+)\s*-\s*\d+/.exec(valRaw); if (m) tpm = parseInt(m[1],10) || tpm;
              }
            }
          }

          if (!(pts||reb||ast||tpm) && typeof a?.shortDisplayName === 'string') {
            const s=a.shortDisplayName;
            const pt=/(\d+)\s*PTS/i.exec(s); if(pt) pts=parseInt(pt[1],10)||pts;
            const rb=/(\d+)\s*REB/i.exec(s); if(rb) reb=parseInt(rb[1],10)||reb;
            const as=/(\d+)\s*AST/i.exec(s); if(as) ast=parseInt(as[1],10)||ast;
            const th=/(\d+)\s*3P(M)?/i.exec(s); if(th) tpm=parseInt(th[1],10)||tpm;
          }

          if (pts||reb||ast||tpm) {
            if (!out[name]) out[name]={pts:0,reb:0,ast:0,tpm:0,teamAbbr};
            out[name].pts+=pts; out[name].reb+=reb; out[name].ast+=ast; out[name].tpm+=tpm; out[name].teamAbbr=teamAbbr;
          }
        }
      }
      return out;
    }

    // ---------- core loader ----------
    async function loadData() {
      try {
        status.textContent = 'Loading…';
        list.innerHTML = '';
        gamesEl.innerHTML = '';

        const teamMetaById = new Map();
        const teamMetaByAbbr = new Map();
        const teamSet = new Set();

        let events = [];
        const gameMeta = new Map(); // eventId -> {home:{abbr,logo,score}, away:{...}, label, statusText}

        async function fetchAndAccumulateScoreboard(url) {
          const sb = await fetch(url).then(r => r.json());
          const evs = Array.isArray(sb.events) ? sb.events : [];
          for (const ev of evs) {
            const comp = ev?.competitions?.[0];
            const comps = comp?.competitors || [];
            const stObj = comp?.status || ev?.status || {};
            const statusText = stObj?.type?.shortDetail || stObj?.type?.detail || stObj?.type?.description || '';
            let home=null, away=null;

            for (const c of comps) {
              const t = c?.team; if (!t) continue;
              const id = t.id, abbr = t.abbreviation;
              const logo = t.logos?.[0]?.href || t.logo || '';
              const score = (typeof c?.score !== 'undefined') ? String(c.score) : '';
              if (id && abbr) {
                if (!teamMetaById.has(id)) teamMetaById.set(id, { abbr, logo });
                if (!teamMetaByAbbr.has(abbr)) teamMetaByAbbr.set(abbr, { abbr, logo });
                teamSet.add(abbr);
              }
              const side = (c?.homeAway || '').toLowerCase();
              if (side === 'home') home = { abbr, logo, score };
              if (side === 'away') away = { abbr, logo, score };
            }
            const label = ev?.name || '';
            if (home && away) gameMeta.set(ev.id, { home, away, label, statusText });

            events.push(ev);
          }
        }

        if (sport === 'nfl') {
          await fetchAndAccumulateScoreboard(urls.nfl.scoreboard({ seasontype: 2, week: activeWeek, year: currentSeasonYear }));
        } else if (sport === 'mlb') {
          await fetchAndAccumulateScoreboard(urls.mlb.scoreboard());
        } else {
          if (viewModeEl.value === 'players') {
            const listOfDates = nbaDates.map(d => d.value); // last 7 days
            for (let i=0; i<listOfDates.length; i+=3) {
              await Promise.all(listOfDates.slice(i,i+3).map(d => fetchAndAccumulateScoreboard(urls.nba.scoreboard(d))));
            }
          } else {
            await fetchAndAccumulateScoreboard(urls.nba.scoreboard(nbaSelectedDate));
          }
        }

        setTeamFilterOptions(teamSet);

        if (!events.length) {
          status.textContent = 'No games found for this selection.';
          currentItems = []; currentGames = [];
          renderPlayersList(); renderMatchups(); renderLeaders(); updateControlVisibility();
          stamp.textContent = `Last fetched: ${new Date().toLocaleString()}`;
          return;
        }

        const byPlayer = new Map();
        const games = new Map();

        function ensureGlobalRow(name, abbr, logoUrl) {
          const label = `${name} (${abbr})`;
          if (!byPlayer.has(label)) byPlayer.set(label, {
            name, abbr, logo: logoUrl || '',
            label,
            byType: {}, mlb: {h:0,r:0,rbi:0,tb:0,hr:0}, nba: {pts:0,reb:0,ast:0,tpm:0},
            total: 0, statValue: 0
          });
          return byPlayer.get(label);
        }
        function ensureGame(eventId) {
          if (!games.has(eventId)) {
            const meta = gameMeta.get(eventId) || { home:{abbr:'HOME',logo:'',score:''}, away:{abbr:'AWAY',logo:'',score:''}, label:'', statusText:'' };
            games.set(eventId, {
              home: { abbr: meta.home.abbr, logo: meta.home.logo, score: meta.home.score, players: {} },
              away: { abbr: meta.away.abbr, logo: meta.away.logo, score: meta.away.score, players: {} },
              label: meta.label,
              statusText: meta.statusText
            });
          }
          return games.get(eventId);
        }
        function selectStatFromMLB(o){ return { tb:o.tb, rbi:o.rbi, r:o.r, h:o.h, hr:o.hr }; }
        function selectStatFromNBA(o){ return { pts:o.pts, reb:o.reb, ast:o.ast, '3pm':o.tpm }; }

        for (let i=0; i<events.length; i+=5) {
          await Promise.all(events.slice(i,i+5).map(async ev => {
            const id = ev.id || (ev.uid && ev.uid.split('~').pop());
            if (!id) return;
            let data;
            if (sport === 'nfl') data = await fetch(urls.nfl.summary(id)).then(r=>r.json());
            else if (sport === 'mlb') data = await fetch(urls.mlb.summary(id)).then(r=>r.json());
            else data = await fetch(urls.nba.summary(id)).then(r=>r.json());

            if (sport === 'nfl') {
              const plays = Array.isArray(data.scoringPlays) ? data.scoringPlays : [];
              const roster = buildRosterNFL(data);
              for (const p of plays) {
                if (!isTouchdownNFL(p)) continue;
                const teamAbbr = p?.team?.abbreviation || '';
                const teamId = p?.team?.id;
                const meta = (teamId && teamMetaById.get(teamId)) || teamMetaByAbbr.get(teamAbbr) || { abbr: teamAbbr, logo: '' };
                const cat = tdCategoryNFL(p);
                const name = resolveNameNFL(parseScorerNameNFL(p), teamId, roster);

                const row = ensureGlobalRow(name, meta.abbr || teamAbbr, meta.logo);
                row.total += 1; row.byType[cat] = (row.byType[cat]||0) + 1; row.statValue = row.total;

                const g = ensureGame(id);
                const side = (meta.abbr===g.home.abbr)?'home':(meta.abbr===g.away.abbr?'away':null);
                if (side) {
                  const bucket = g[side].players;
                  if (!bucket[name]) bucket[name] = { name, total:0, byType:{}, statValue:0 };
                  bucket[name].total += 1; bucket[name].byType[cat]=(bucket[name].byType[cat]||0)+1;
                  bucket[name].statValue = bucket[name].total;
                }
              }
            } else if (sport === 'mlb') {
              const hitters = extractMLBHittersFromBoxscore(data);
              for (const [name, s] of Object.entries(hitters)) {
                const meta = teamMetaByAbbr.get(s.teamAbbr) || { abbr: s.teamAbbr, logo:'' };
                const row = ensureGlobalRow(name, meta.abbr, meta.logo);
                const dest=row.mlb; dest.h+=s.h; dest.r+=s.r; dest.rbi+=s.rbi; dest.tb+=s.tb; dest.hr+=s.hr;
                row.statValue = selectStatFromMLB(dest)[mlbStatEl.value] || 0;

                const g = ensureGame(id);
                const side = (meta.abbr===g.home.abbr)?'home':(meta.abbr===g.away.abbr?'away':null);
                if (side) {
                  const bucket=g[side].players;
                  if (!bucket[name]) bucket[name]={ name, mlb:{h:0,r:0,rbi:0,tb:0,hr:0}, statValue:0 };
                  const t=bucket[name].mlb; t.h+=s.h; t.r+=s.r; t.rbi+=s.rbi; t.tb+=s.tb; t.hr+=s.hr;
                  bucket[name].statValue = selectStatFromMLB(t)[mlbStatEl.value] || 0;
                }
              }
            } else {
              const players = extractNBAPlayersFromBoxscore(data); // name -> {pts,reb,ast,tpm,teamAbbr}
              for (const [name, s] of Object.entries(players)) {
                const meta = teamMetaByAbbr.get(s.teamAbbr) || { abbr: s.teamAbbr, logo:'' };
                const row = ensureGlobalRow(name, meta.abbr, meta.logo);
                const dest=row.nba; dest.pts+=s.pts; dest.reb+=s.reb; dest.ast+=s.ast; dest.tpm+=s.tpm;
                row.statValue = selectStatFromNBA(dest)[nbaStatEl.value] || 0;

                const g = ensureGame(id);
                const side = (meta.abbr===g.home.abbr)?'home':(meta.abbr===g.away.abbr?'away':null);
                if (side) {
                  const bucket=g[side].players;
                  if (!bucket[name]) bucket[name]={ name, nba:{pts:0,reb:0,ast:0,tpm:0}, statValue:0 };
                  const t=bucket[name].nba; t.pts+=s.pts; t.reb+=s.reb; t.ast+=s.ast; t.tpm+=s.tpm;
                  bucket[name].statValue = selectStatFromNBA(t)[nbaStatEl.value] || 0;
                }
              }
            }
          }));
        }

        currentItems = [...byPlayer.values()];
        currentGames = events.map(ev => games.get(ev.id)).filter(Boolean);

        renderPlayersList();
        if (viewModeEl.value === 'matchups') renderMatchups();
        renderLeaders();

        status.textContent = '';
        stamp.textContent = `Last fetched: ${new Date().toLocaleString()}`;

        startAutoRefresh();
        updateControlVisibility();
      } catch (err) {
        console.error(err);
        status.textContent = 'Could not load data.';
      }
    }

    // ---------- init ----------
    try {
      const sbNowNFL = await fetch(urls.nfl.scoreboard()).then(r => r.json());
      currentSeasonYear = sbNowNFL?.season?.year || new Date().getFullYear();
      currentSeasonType = sbNowNFL?.season?.type || 2;
      currentWeek = sbNowNFL?.week?.number || 1;
      activeWeek = (currentSeasonType === 2 && currentWeek) ? currentWeek : currentWeek || 1;
      populateWeekDropdown(activeWeek);

      buildNBADates();

      // Handlers
      sportSelectEl.addEventListener('change', () => {
        sport = sportSelectEl.value;
        teamFilterEl.value = '';
        sortModeEl.value = 'stat';
        updateControlVisibility();
        loadData();
      });

      weekSelectEl.addEventListener('change', () => {
        activeWeek = parseInt(weekSelectEl.value, 10);
        teamFilterEl.value = '';
        sortModeEl.value = 'stat';
        loadData();
      });

      mlbStatEl.addEventListener('change', () => {
        if (sport === 'mlb') {
          for (const row of currentItems) if (row.mlb) row.statValue = ({tb:row.mlb.tb,rbi:row.mlb.rbi,r:row.mlb.r,h:row.mlb.h,hr:row.mlb.hr})[mlbStatEl.value] || 0;
          for (const g of currentGames) for (const side of ['home','away']) for (const p of Object.values(g[side].players)) if (p.mlb) p.statValue = ({tb:p.mlb.tb,rbi:p.mlb.rbi,r:p.mlb.r,h:p.mlb.h,hr:p.mlb.hr})[mlbStatEl.value] || 0;
          setTitleForContext(); renderPlayersList(); if (list.hidden) renderMatchups(); renderLeaders();
        }
      });

      nbaStatEl.addEventListener('change', () => {
        if (sport === 'nba') {
          for (const row of currentItems) if (row.nba) row.statValue = ({pts:row.nba.pts,reb:row.nba.reb,ast:row.nba.ast,'3pm':row.nba.tpm})[nbaStatEl.value] || 0;
          for (const g of currentGames) for (const side of ['home','away']) for (const p of Object.values(g[side].players)) if (p.nba) p.statValue = ({pts:p.nba.pts,reb:p.nba.reb,ast:p.nba.ast,'3pm':p.nba.tpm})[nbaStatEl.value] || 0;
          setTitleForContext(); renderPlayersList(); if (list.hidden) renderMatchups(); renderLeaders();
        }
      });

      nbaDateEl.addEventListener('change', () => {
        nbaSelectedDate = nbaDateEl.value;
        if (sport === 'nba' && viewModeEl.value === 'matchups') loadData();
        setTitleForContext();
      });

      viewModeEl.addEventListener('change', () => {
        updateControlVisibility();
        if (viewModeEl.value === 'matchups' && gamesEl.innerHTML.trim() === '') {
          renderMatchups();
        }
      });

      const csvBtn = document.getElementById('nflCsvBtn');
      const csvStatus = document.getElementById('nflCsvStatus');
      const csvSeasonEl = document.getElementById('csvSeason');
      for (let y = currentSeasonYear; y >= currentSeasonYear - 2; y--) {
        csvSeasonEl.insertAdjacentHTML('beforeend', `<option value="${y}">${y}${y === currentSeasonYear ? ' (current)' : ''}</option>`);
      }
      csvBtn.addEventListener('click', async () => {
        csvBtn.disabled = true;
        try {
          const season = parseInt(csvSeasonEl.value, 10);
          const { csv, weeks, rowCount, upcomingWeek } = await buildNFLSeasonCSV(season, msg => { csvStatus.textContent = msg; });
          const span = weeks ? `weeks-1-${weeks}` : 'preseason';
          downloadText(`nfl-player-games-${season}-${span}${upcomingWeek ? `-plus-week-${upcomingWeek}` : ''}.csv`, csv);
          csvStatus.textContent = `Downloaded ${rowCount} rows (${season}, weeks 1–${weeks}${upcomingWeek ? ` + upcoming week ${upcomingWeek}` : ''}).`;
        } catch (err) {
          console.error(err);
          csvStatus.textContent = err?.message || 'Could not build CSV.';
        } finally {
          csvBtn.disabled = false;
        }
      });

      teamFilterEl.addEventListener('change', () => { renderPlayersList(); /* ribbon stays global */ });
      sortModeEl.addEventListener('change', () => { renderPlayersList(); /* ribbon stays global */ });

      await loadData();
    } catch (e) {
      console.error(e);
      status.textContent = 'Failed to initialize.';
    }
  })();
  </script>
</body>
</html>
