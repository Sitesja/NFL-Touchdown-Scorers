name: Update nflverse data

# Copies nflverse snap counts and injury reports into data/ so the site can read them
# (nflverse's own files can't be fetched from a browser on another domain).
on:
  schedule:
    - cron: "0 11 * * *"   # daily, ~6-7am US Eastern
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current-season files
        run: |
          set -euo pipefail
          # NFL seasons start in September; Jan-Feb games belong to the previous season.
          YEAR=$(date -u +%Y); MONTH=$(date -u +%-m)
          if [ "$MONTH" -lt 3 ]; then YEAR=$((YEAR - 1)); fi
          mkdir -p data
          for f in snap_counts injuries; do
            url="https://github.com/nflverse/nflverse-data/releases/download/${f}/${f}_${YEAR}.csv"
            if curl -fsSL "$url" -o "data/${f}_${YEAR}.csv.tmp"; then
              mv "data/${f}_${YEAR}.csv.tmp" "data/${f}_${YEAR}.csv"
            else
              echo "No ${f} file for ${YEAR} yet"; rm -f "data/${f}_${YEAR}.csv.tmp"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update nflverse data"
          git push
